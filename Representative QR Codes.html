<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Representative QR Codes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{ --bros:#3d92e8; --belles:#e8399c; --text:#111; --dim:#666; }
  *{box-sizing:border-box;}
  body{font-family:'Cinzel', serif; padding:30px; color:var(--text); background:#fff;}
  h1{font-size:22px; margin-bottom:24px; text-align:center;}
  .grid{display:grid; grid-template-columns:repeat(2, 1fr); gap:24px; max-width:600px; margin:0 auto;}
  .card{border:1px solid #ddd; border-radius:8px; padding:20px; text-align:center; page-break-inside:avoid;}
  .card.bros{border-top:4px solid var(--bros);}
  .card.belles{border-top:4px solid var(--belles);}
  .card h2{font-size:18px; margin-bottom:12px;}
  .card.bros h2{color:var(--bros);}
  .card.belles h2{color:var(--belles);}
  .card img{width:220px; height:220px;}
  .card p{font-size:12px; color:var(--dim); margin-top:10px; word-break:break-all;}
  @media print{ body{padding:0;} }
</style>
</head>
<body>

<h1>Bros. vs. Belles — Representative QR Codes</h1>
<div class="grid" id="grid"></div>

<script>
  const ANSWER_PAGE_URL = "https://brotheo.github.io/Bros-vs-Belles-Game/answer-page.html";

  const groups = [
    { id: 'bros1', name: 'Bros.', house: 'bros' },
    { id: 'belles1', name: 'Belles.', house: 'belles' }
  ];

  const grid = document.getElementById('grid');
  groups.forEach(g => {
    const link = ANSWER_PAGE_URL + '?group=' + encodeURIComponent(g.id);
    const qrSrc = 'https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=' + encodeURIComponent(link);
    const card = document.createElement('div');
    card.className = 'card ' + g.house;
    card.innerHTML = `
      <h2>${g.name}</h2>
      <img src="${qrSrc}" alt="QR code for ${g.name}">
      <p>${link}</p>
    `;
    grid.appendChild(card);
  });
</script>

</body>
</html>
