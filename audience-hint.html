<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bros. vs. Belles — Audience Hint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08080b; --panel:#111116; --line:#1c1c22;
    --cyan:#3ddbe8; --gold:#e8c778; --bros:#3d92e8; --belles:#e8399c;
    --text:#f2f1ec; --text-dim:#8a8a92;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background: radial-gradient(ellipse at 50% 30%, #101015 0%, #08080b 70%);
    color:var(--text); font-family:'Cinzel', serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:22px; text-align:center;
  }
  .house-title{font-size:16px; letter-spacing:0.08em; margin-bottom:4px;}
  .house-title.bros{color:var(--bros);}
  .house-title.belles{color:var(--belles);}
  .subtitle{font-size:12px; color:var(--text-dim); margin-bottom:26px;}
  .category-tag{font-size:12px; letter-spacing:0.08em; color:var(--cyan); margin-bottom:10px;}
  .question-text{font-size:19px; font-weight:700; line-height:1.4; margin-bottom:22px; padding:0 4px;}
  .options{display:flex; flex-direction:column; gap:12px; width:100%; max-width:400px;}
  button.opt{
    font-family:'Cinzel', serif; font-size:16px; color:var(--text);
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:16px 10px; cursor:pointer;
  }
  button.opt:active{transform:scale(0.98);}
  button.opt.picked{border-color:var(--gold); color:var(--gold);}
  .feedback{margin-top:22px; font-size:14px; color:var(--text-dim); min-height:20px;}
  .waiting{color:var(--text-dim); font-size:15px; margin-top:40px;}
  .rep-timer{font-size:13px; color:var(--text-dim); margin-top:16px;}
  .rep-timer.urgent{color:var(--belles); font-weight:700;}
  .closed-msg{color:var(--gold); font-size:16px; margin-top:40px;}
</style>
</head>
<body>

<div class="house-title" id="house-title">Loading…</div>
<div class="subtitle">Vote to help your representative on stage. This does not affect the score.</div>

<div id="game-area">
  <div class="waiting">Waiting for the host to start...</div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbzopg2EZMulQXRc8Y_0zfne-S62L9CUNvm6laSCCV4fpjsddUDCUFYUXErvyWOcv3uWkg/exec";
  const params = new URLSearchParams(window.location.search);
  const houseParam = (params.get('house') || '').toLowerCase();
  const house = houseParam === 'belles' ? 'Belles' : houseParam === 'bros' ? 'Bros' : '';

  document.getElementById('house-title').textContent = house ? (house + ' Audience') : 'Open this page from your house QR code';
  if(house) document.getElementById('house-title').className = 'house-title ' + house.toLowerCase();

  function getVoterId(){
    let id = localStorage.getItem('bvb_voter_id');
    if(!id){
      id = 'v-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem('bvb_voter_id', id);
    }
    return id;
  }
  const voterId = getVoterId();

  let renderedQid = null;
  let closedQid = null;
  let myPick = null;
  let latestState = null;
  let writeGen = 0;
  let lastStartMs = 0;
  let pollInFlight = false;
  let serverOffset = 0;
  let lastSyncAt = 0;

  function parseStartTime(value){
    if(value === '' || value == null) return 0;
    if(typeof value === 'number' && Number.isFinite(value)) return value > 1e11 ? value : value * 1000;
    const str = String(value);
    const prefixed = str.match(/ms:(\d+)/);
    if(prefixed) return Number(prefixed[1]);
    const num = Number(str);
    if(Number.isFinite(num) && num > 1e11) return num;
    if(Number.isFinite(num) && num > 1e9) return num * 1000;
    const parsed = Date.parse(str);
    return Number.isFinite(parsed) ? parsed : 0;
  }
  function noteServerNow(serverNow){
    if(typeof serverNow === 'number' && serverNow > 0){
      serverOffset = serverNow - Date.now();
      lastSyncAt = Date.now();
    }
  }
  function nowMs(){ return Date.now() + serverOffset; }
  function remainingSeconds(state){
    if(!state) return 0;
    const start = parseStartTime(state.start_time);
    const dur = Number(state.duration_seconds || 25);
    if(start > 0) return Math.max(0, dur - (nowMs() - start) / 1000);
    if(typeof state.remaining_seconds === 'number'){
      return Math.max(0, state.remaining_seconds - (nowMs() - lastSyncAt) / 1000);
    }
    return 0;
  }
  function isStaleState(state){
    const start = parseStartTime(state.start_time);
    if(state.finished || !state.question) return false;
    return lastStartMs > 0 && start > 0 && start < lastStartMs;
  }
  function rememberStart(state){
    if(state.finished || !state.question) lastStartMs = 0;
    else {
      const start = parseStartTime(state.start_time);
      if(start > lastStartMs) lastStartMs = start;
    }
  }

  async function api(paramsObj){
    const url = API_URL + '?' + new URLSearchParams(Object.assign({}, paramsObj, { _: String(Date.now()) })).toString();
    const res = await fetch(url, { cache: 'no-store' });
    return res.json();
  }

  async function pickOption(option, btnEl){
    if(!house) return;
    if(!latestState || remainingSeconds(latestState) <= 0 || latestState.locked_by) return;
    myPick = option;
    document.querySelectorAll('.opt').forEach(b => b.classList.remove('picked'));
    btnEl.classList.add('picked');
    const fb = document.getElementById('feedback');
    if(fb) fb.textContent = 'Vote counted — you can change it anytime.';
    writeGen++;
    await api({ action: 'submitVote', house: house, voter_id: voterId, choice: option });
  }

  function renderQuestion(state){
    const area = document.getElementById('game-area');
    area.innerHTML =
      '<div class="category-tag"></div>' +
      '<div class="question-text"></div>' +
      '<div class="options" id="options"></div>' +
      '<div class="feedback" id="feedback"></div>' +
      '<div class="rep-timer" id="rep-timer"></div>';
    area.querySelector('.category-tag').textContent = state.question.category;
    area.querySelector('.question-text').textContent = state.question.question;
    const fb = document.getElementById('feedback');
    if(myPick) fb.textContent = 'Vote counted — you can change it anytime.';
    const optsDiv = document.getElementById('options');
    state.question.options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'opt' + (opt === myPick ? ' picked' : '');
      btn.textContent = opt;
      btn.onclick = () => pickOption(opt, btn);
      optsDiv.appendChild(btn);
    });
  }

  function updateTimer(){
    const el = document.getElementById('rep-timer');
    const state = latestState;
    if(!el || !state || !state.question) return;
    const rem = remainingSeconds(state);
    const shown = Math.ceil(rem);
    el.textContent = shown + 's left to vote';
    el.classList.toggle('urgent', shown <= 5 && rem > 0);
    if(rem <= 0) showClosed("Time's up — voting closed.");
  }

  function showWaiting(msg){
    document.getElementById('game-area').innerHTML = '<div class="waiting">' + msg + '</div>';
    renderedQid = null;
    closedQid = null;
    myPick = null;
  }

  function showClosed(msg){
    const state = latestState;
    const qid = state && state.question ? String(state.question.id) : '';
    if(qid && closedQid === qid) return;
    closedQid = qid;
    renderedQid = qid || null;
    document.getElementById('game-area').innerHTML = '<div class="closed-msg"></div>';
    document.querySelector('.closed-msg').textContent = msg;
  }

  async function poll(){
    if(!house || pollInFlight) return;
    pollInFlight = true;
    const seenWrite = writeGen;
    try{
      const state = await api({ action: 'getState' });
      if(seenWrite !== writeGen) return;
      applyState(state);
    } catch(e){
    } finally {
      pollInFlight = false;
    }
  }

  function applyState(state){
    if(!state || state.error) return;
    if(!Array.isArray(state.groups)) return;
    if(isStaleState(state)) return;
    noteServerNow(state.server_now);
    rememberStart(state);
    latestState = state;

    if(state.finished){
      showWaiting('Game over — wait for the host.');
      return;
    }
    if(!state.question){
      showWaiting('Waiting for the next question...');
      return;
    }

    const qid = String(state.question.id);
    const isNew = qid !== renderedQid;
    if(isNew){
      renderedQid = qid;
      closedQid = null;
      myPick = null;
    }

    if(state.locked_by){
      const locker = (state.groups || []).find(g => g.group_id === state.locked_by);
      showClosed((locker && locker.display_name ? locker.display_name : 'A representative') + ' already answered — voting closed!');
      return;
    }
    if(remainingSeconds(state) <= 0){
      showClosed("Time's up — voting closed.");
      return;
    }

    if(closedQid === qid) return;
    if(isNew || !document.getElementById('options')) renderQuestion(state);
    updateTimer();
  }

  if(!house){
    showWaiting('Scan the Bros Audience or Belles Audience QR code.');
  } else {
    poll();
    setInterval(poll, 2000);
    setInterval(updateTimer, 100);
  }
</script>

</body>
</html>
