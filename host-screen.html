<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bros. vs. Belles — Host Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08080b; --panel:#111116; --line:#1c1c22;
    --cyan:#3ddbe8; --bros:#3d92e8; --belles:#e8399c; --gold:#e8c778;
    --text:#f2f1ec; --text-dim:#8a8a92;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background: radial-gradient(ellipse at 50% 40%, #101015 0%, #08080b 70%);
    color:var(--text); font-family:'Cinzel', serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:26px; overflow-x:hidden;
  }
  .top-row{
    width:100%; max-width:1400px; display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;
  }
  .wordmark{font-size:22px; font-weight:700; color:var(--cyan); letter-spacing:0.08em;}
  .controls button{
    font-family:'Cinzel', serif; font-size:13px; letter-spacing:0.06em; color:var(--text-dim);
    background:transparent; border:1px solid var(--line); border-radius:4px; padding:9px 18px;
    cursor:pointer; margin-left:10px;
  }
  .controls button:hover{color:var(--text); border-color:var(--text-dim);}
  .controls button:disabled{opacity:0.4; cursor:default;}

  .question-panel{
    width:100%; max-width:1200px; background:linear-gradient(180deg, var(--panel), #0c0c10);
    border:1px solid var(--line); border-radius:8px; padding:34px 40px; text-align:center; margin-bottom:22px;
  }
  .category-tag{font-size:13px; letter-spacing:0.1em; color:var(--gold); margin-bottom:14px;}
  .question-counter{font-size:12px; letter-spacing:0.08em; color:var(--text-dim); margin-bottom:6px;}
  .question-text{font-size:clamp(22px, 3vw, 34px); font-weight:700; line-height:1.35; margin-bottom:24px;}
  .options-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:12px; margin-bottom:22px;}
  .option{
    border:1px solid var(--line); border-radius:6px; padding:14px 10px; font-size:16px; color:var(--text-dim);
    background:#0c0c10; transition:border-color 140ms ease, color 140ms ease;
  }
  .option.hit{border-color:var(--gold); color:var(--gold);}
  .timer{font-family:'Bebas Neue', sans-serif; font-size:56px; color:var(--cyan); transition:color 200ms ease;}
  .timer.urgent{color:var(--belles);}
  .timer-track{width:100%; max-width:400px; height:5px; background:var(--line); border-radius:3px; margin:8px auto 0; overflow:hidden;}
  .timer-bar{height:100%; background:var(--cyan); transition:width 200ms linear, background 200ms ease; width:100%;}
  .timer-bar.urgent{background:var(--belles);}
  .status-line{font-size:14px; color:var(--text-dim); margin-top:10px; min-height:20px;}

  .houses{
    width:100%; max-width:1200px; display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:20px;
  }
  .house{
    background:linear-gradient(180deg, var(--panel), #0c0c10); border:1px solid var(--line); border-radius:8px;
    padding:22px; text-align:center; position:relative; overflow:hidden;
  }
  .house::before{content:""; position:absolute; top:0; left:0; right:0; height:3px;}
  .house.bros::before{background:var(--bros);}
  .house.belles::before{background:var(--belles);}
  .house-name{font-size:20px; font-weight:700; letter-spacing:0.05em; margin-bottom:8px; display:flex; align-items:center; justify-content:center; gap:8px;}
  .house.bros .house-name{color:var(--bros);}
  .house.belles .house-name{color:var(--belles);}
  .answered-check{
    display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px;
    border-radius:50%; border:1px solid var(--line); font-size:12px; color:transparent; transition:all 160ms ease;
  }
  .answered-check.hit{background:#5fd18a; border-color:#5fd18a; color:#08080b;}
  .house-total{font-family:'Bebas Neue', sans-serif; font-size:80px; line-height:0.9; transition:transform 160ms ease;}
  .house-total.bump{transform:scale(1.08);}
  .groups-row{display:flex; justify-content:center; gap:14px; margin-top:14px; flex-wrap:wrap;}
  .group-chip{font-size:13px; color:var(--text-dim); border:1px solid var(--line); border-radius:4px; padding:6px 12px;}
  .group-chip .g-score{color:var(--text); font-weight:500; margin-left:6px;}

  .qr-hint{font-size:12px; color:var(--text-dim); letter-spacing:0.05em;}
  @media (max-width:820px){ .houses{grid-template-columns:1fr;} }
</style>
</head>
<body>

<div class="top-row">
  <div class="wordmark">BROS. VS. BELLES</div>
  <div class="controls">
    <button id="mute-btn" onclick="toggleMute()">🔊 sound</button>
    <button id="start-btn" onclick="startGame()">Start game</button>
    <button id="skip-btn" onclick="skipQuestion()">Skip ⏭</button>
    <button id="reset-btn" onclick="resetGame()">Reset game</button>
  </div>
</div>

<div class="question-panel">
  <div class="question-counter" id="q-counter"></div>
  <div class="category-tag" id="category">waiting to start</div>
  <div class="question-text" id="question-text">Click "Start game" to begin</div>
  <div class="options-grid" id="options"></div>
  <div class="timer" id="timer">--</div>
  <div class="timer-track"><div class="timer-bar" id="timer-bar"></div></div>
  <div class="status-line" id="status"></div>
</div>

<div class="houses">
  <div class="house bros">
    <div class="house-name">Bros. <span class="answered-check" id="bros-check">✓</span></div>
    <div class="house-total" id="bros-total">0</div>
  </div>
  <div class="house belles">
    <div class="house-name">Belles. <span class="answered-check" id="belles-check">✓</span></div>
    <div class="house-total" id="belles-total">0</div>
  </div>
</div>

<div class="qr-hint">Groups answer on their phones — open group-qr-codes.html to display or print their QR codes.</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbzopg2EZMulQXRc8Y_0zfne-S62L9CUNvm6laSCCV4fpjsddUDCUFYUXErvyWOcv3uWkg/exec";

  let muted = false;
  let audioCtx = null;
  let pollTimer = null;
  let lastLockedBy = '';
  let lastScores = {};
  let lastQuestionId = null;
  let lastTickSecond = null;
  let latestState = null;
  let advancing = false;
  let advanceTimeoutId = null;
  let actionBusy = false;
  let writeGen = 0;
  let lastStartMs = 0;
  let pollInFlight = false;
  let serverOffset = 0;
  let lastSyncAt = 0;

  function parseStartTime(value){
    if(value === '' || value == null) return 0;
    if(typeof value === 'number' && Number.isFinite(value)) return value > 1e11 ? value : value * 1000;
    const str = String(value);
    const prefixed = str.match(/ms:(\d+)/);
    if(prefixed) return Number(prefixed[1]);
    const num = Number(str);
    if(Number.isFinite(num) && num > 1e11) return num;
    if(Number.isFinite(num) && num > 1e9) return num * 1000;
    const parsed = Date.parse(str);
    return Number.isFinite(parsed) ? parsed : 0;
  }
  function noteServerNow(serverNow){
    if(typeof serverNow === 'number' && serverNow > 0){
      serverOffset = serverNow - Date.now();
      lastSyncAt = Date.now();
    }
  }
  function nowMs(){ return Date.now() + serverOffset; }
  function remainingSeconds(state){
    if(!state) return 0;
    const start = parseStartTime(state.start_time);
    const dur = Number(state.duration_seconds || 25);
    if(start > 0) return Math.max(0, dur - (nowMs() - start) / 1000);
    if(typeof state.remaining_seconds === 'number'){
      return Math.max(0, state.remaining_seconds - (nowMs() - lastSyncAt) / 1000);
    }
    return 0;
  }
  function esc(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function getCtx(){
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function tone(ctx, freq, t, dur, type, peak){
    const osc = ctx.createOscillator(); const gain = ctx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(peak, t + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function playCorrect(){
    if(muted) return;
    const ctx = getCtx(); const t = ctx.currentTime;
    tone(ctx,523.25,t,0.16,'sine',0.22);
    tone(ctx,659.25,t+0.10,0.16,'sine',0.22);
    tone(ctx,783.99,t+0.20,0.28,'sine',0.24);
  }
  function playTick(){
    if(muted) return;
    const ctx = getCtx(); const t = ctx.currentTime;
    tone(ctx,880,t,0.06,'square',0.05);
  }
  function toggleMute(){
    muted = !muted;
    document.getElementById('mute-btn').textContent = muted ? '🔇 sound' : '🔊 sound';
  }

  async function api(params){
    const url = API_URL + '?' + new URLSearchParams(Object.assign({}, params, { _: String(Date.now()) })).toString();
    const res = await fetch(url, { cache: 'no-store' });
    return res.json();
  }

  function clearAdvance(){
    advancing = false;
    if(advanceTimeoutId){ clearTimeout(advanceTimeoutId); advanceTimeoutId = null; }
  }

  function isStaleState(state){
    const start = parseStartTime(state.start_time);
    if(state.finished || !state.question) return false;
    return lastStartMs > 0 && start > 0 && start < lastStartMs;
  }
  function rememberStart(state){
    if(state.finished || !state.question) lastStartMs = 0;
    else {
      const start = parseStartTime(state.start_time);
      if(start > lastStartMs) lastStartMs = start;
    }
  }

  async function runAction(params){
    const myWrite = ++writeGen;
    clearAdvance();
    const state = await api(params);
    if(myWrite !== writeGen) return;
    applyState(state);
  }

  async function startGame(){
    if(actionBusy) return;
    const state = latestState;
    if(state && state.question && !state.finished) return;
    actionBusy = true;
    try{
      if(state && state.finished){
        await runAction({ action: 'resetGame' });
      }
      await runAction({ action: 'nextQuestion' });
      ensureLoops();
    } finally {
      actionBusy = false;
    }
  }

  async function skipQuestion(){
    if(actionBusy) return;
    if(!latestState || !latestState.question || latestState.finished) return;
    if(!confirm('Skip this question?')) return;
    actionBusy = true;
    try{
      await runAction({ action: 'nextQuestion' });
      ensureLoops();
    } finally {
      actionBusy = false;
    }
  }

  async function resetGame(){
    if(actionBusy) return;
    if(!confirm('Reset scores, votes, and the question deck?')) return;
    actionBusy = true;
    try{
      await runAction({ action: 'resetGame' });
      lastQuestionId = null;
      lastLockedBy = '';
      lastTickSecond = null;
      showIdle();
      poll(true);
    } finally {
      actionBusy = false;
    }
  }

  function showIdle(){
    document.getElementById('q-counter').textContent = '';
    document.getElementById('category').textContent = 'waiting to start';
    document.getElementById('question-text').textContent = 'Click "Start game" to begin';
    document.getElementById('options').innerHTML = '';
    document.getElementById('timer').textContent = '--';
    document.getElementById('timer-bar').style.width = '100%';
    document.getElementById('timer').classList.remove('urgent');
    document.getElementById('timer-bar').classList.remove('urgent');
    document.getElementById('status').textContent = '';
    document.getElementById('bros-check').classList.remove('hit');
    document.getElementById('belles-check').classList.remove('hit');
  }

  function renderGroups(groups){
    const houses = { Bros: [], Belles: [] };
    (groups || []).forEach(g => { if(houses[g.house]) houses[g.house].push(g); });
    bumpIfChanged('bros-total', houses.Bros.reduce((a,g)=>a+Number(g.score),0));
    bumpIfChanged('belles-total', houses.Belles.reduce((a,g)=>a+Number(g.score),0));
  }

  function bumpIfChanged(id, value){
    const el = document.getElementById(id);
    const prev = lastScores[id];
    el.textContent = value;
    if(prev !== undefined && prev !== value){
      el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
    }
    lastScores[id] = value;
  }

  function updateButtons(state){
    const inRound = !!(state && state.question && !state.finished);
    document.getElementById('start-btn').disabled = inRound;
    document.getElementById('start-btn').textContent = (state && state.finished) ? 'Play again' : 'Start game';
    document.getElementById('skip-btn').disabled = !inRound;
  }

  function scheduleAdvance(delay){
    if(advancing) return;
    advancing = true;
    advanceTimeoutId = setTimeout(async ()=>{
      const myWrite = ++writeGen;
      try{
        const nextState = await api({ action: 'nextQuestion' });
        if(myWrite !== writeGen) return;
        advancing = false;
        advanceTimeoutId = null;
        applyState(nextState);
      } catch(e){
        advancing = false;
        advanceTimeoutId = null;
      }
    }, delay);
  }

  function considerAdvance(state){
    if(advancing || !state || state.finished || !state.question) return;
    if(state.locked_by){
      scheduleAdvance(1800);
      return;
    }
    const start = parseStartTime(state.start_time);
    const canTrust = start > 0 || typeof state.remaining_seconds === 'number';
    if(canTrust && remainingSeconds(state) <= 0) scheduleAdvance(1500);
  }

  function paintTimer(){
    const state = latestState;
    const timerEl = document.getElementById('timer');
    const barEl = document.getElementById('timer-bar');
    if(!state || !state.question || state.finished){
      return;
    }
    const dur = Number(state.duration_seconds || 25);
    const rem = remainingSeconds(state);
    const shown = Math.ceil(rem);
    const pct = Math.max(0, Math.min(100, rem / dur * 100));
    timerEl.textContent = shown;
    barEl.style.width = pct + '%';
    const urgent = shown <= 5 && rem > 0;
    timerEl.classList.toggle('urgent', urgent);
    barEl.classList.toggle('urgent', urgent);
    if(urgent && shown !== lastTickSecond){
      lastTickSecond = shown;
      playTick();
    }
    if(rem <= 0){
      if(!state.locked_by && document.getElementById('status').textContent.indexOf('got it') === -1){
        document.getElementById('status').textContent = "Time's up — no one locked in!";
      } else if(state.locked_by){
        document.getElementById('status').textContent = document.getElementById('status').textContent || 'Next question...';
      }
      considerAdvance(state);
    }
  }

  async function poll(force){
    if(pollInFlight && !force) return;
    pollInFlight = true;
    const seenWrite = writeGen;
    try{
      const state = await api({ action: 'getState' });
      if(seenWrite !== writeGen) return;
      applyState(state);
    } catch(e){
    } finally {
      pollInFlight = false;
    }
  }

  function applyState(state){
    if(!state || state.error) return;
    if(!Array.isArray(state.groups)) return;
    if(isStaleState(state)) return;
    noteServerNow(state.server_now);
    rememberStart(state);
    latestState = state;
    updateButtons(state);
    renderGroups(state.groups);

    if(state.finished){
      lastQuestionId = null;
      document.getElementById('q-counter').textContent = 'Final scores';
      document.getElementById('category').textContent = 'game over';
      document.getElementById('question-text').textContent = 'All questions done — Play again to start a new match';
      document.getElementById('options').innerHTML = '';
      document.getElementById('timer').textContent = '0';
      document.getElementById('timer-bar').style.width = '0%';
      document.getElementById('status').textContent = 'Thanks for playing!';
      clearAdvance();
      return;
    }

    if(!state.question){
      lastQuestionId = null;
      showIdle();
      updateButtons(state);
      return;
    }

    const qid = String(state.question.id);
    if(qid !== lastQuestionId){
      lastQuestionId = qid;
      lastTickSecond = null;
      lastLockedBy = '';
      document.getElementById('bros-check').classList.remove('hit');
      document.getElementById('belles-check').classList.remove('hit');
      document.getElementById('status').textContent = '';
      document.getElementById('q-counter').textContent = 'Question ' + state.question_number + ' of ' + state.total_questions;
      document.getElementById('category').textContent = state.question.category;
      document.getElementById('question-text').textContent = state.question.question;
      document.getElementById('options').innerHTML = state.question.options.map(o =>
        '<div class="option">' + esc(o) + '</div>').join('');
    }

    if(state.locked_by && state.locked_by !== lastLockedBy){
      playCorrect();
      const g = (state.groups || []).find(x => x.group_id === state.locked_by);
      document.getElementById('status').textContent = g ? (g.display_name + ' got it! +100') : 'Correct!';
      if(state.locked_house === 'Bros') document.getElementById('bros-check').classList.add('hit');
      if(state.locked_house === 'Belles') document.getElementById('belles-check').classList.add('hit');
    }
    lastLockedBy = state.locked_by || '';
    paintTimer();
    considerAdvance(state);
  }

  function ensureLoops(){
    if(!pollTimer) pollTimer = setInterval(() => poll(false), 1000);
  }

  ensureLoops();
  setInterval(paintTimer, 100);
  poll(true);
</script>

</body>
</html>
